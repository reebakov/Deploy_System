<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<title>Инвентарь - Deploy System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    [data-bs-theme="dark"] body { background-color: #1a1d21; }
    pre { max-height: 600px; overflow-y: auto; }
</style>
</head>
<body style="background-color: #f8f9fa;">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/">🚀 Deploy System</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/">История</a>
      <a class="nav-link active" href="/inventory">Инвентарь группы</a>
    </div>
    <button class="btn btn-outline-light btn-sm" id="theme-toggle" type="button" title="Тема">🌓</button>
  </div>
</nav>

<div class="container-fluid px-4">
  <h2 class="mb-4">📦 Группа {{ target_group }}</h2>
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">Список ПК</div>
        <ul class="list-group list-group-flush">
          {% for pc in clubgg_pcs %}
          <li class="list-group-item fw-bold">{{ pc }}</li>
          {% else %}
          <li class="list-group-item text-muted">Группа пуста или не найдена</li>
          {% endfor %}
        </ul>
        <div class="card-footer text-muted small">
          Всего машин: {{ clubgg_pcs|length }}
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">Сырой файл инвентаря</div>
        <div class="card-body">
          <pre>{{ raw_content }}</pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-bs-theme', saved);
})();
document.getElementById('theme-toggle').addEventListener('click', function () {
  const cur = document.documentElement.getAttribute('data-bs-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-bs-theme', next);
  localStorage.setItem('theme', next);
});
</script>
</body>
</html>
